name: Atlas Windows baseline
on:
  workflow_dispatch:
  push:
    branches: [atlas/main]
  pull_request:
    branches: [atlas/main]
permissions:
  contents: read
concurrency:
  group: atlas-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CMake and upstream tools
        shell: pwsh
        run: |
          python -m pip install cmake==3.31.6
          choco install strawberryperl pkgconfiglite -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          # Chocolatey changes are not inherited by this running shell.
          'C:\Strawberry\perl\bin' >> $env:GITHUB_PATH
          'C:\Strawberry\c\bin' >> $env:GITHUB_PATH
      - name: Verify unchanged upstream application
        run: python atlas/scripts/verify_baseline.py
      - name: Verify Windows toolchain before long builds
        id: toolchain
        shell: pwsh
        run: |
          ./atlas/scripts/build-windows.ps1 -Stage Preflight
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Invalidate cached native libraries whenever the runner image changes.
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT
      - name: Restore Windows dependencies
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: deps/build
          key: atlas-deps-win2022-x64-cmake3316-${{ steps.toolchain.outputs.image }}-${{ hashFiles('deps/**', 'cmake/**') }}
      - name: Compile dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./atlas/scripts/build-windows.ps1 -Stage Dependencies
      - name: Save successful dependencies before application build
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps/build
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Configure Windows application
        shell: pwsh
        run: ./atlas/scripts/build-windows.ps1 -Stage Configure
      - name: Compile and install application and tests
        id: compile
        shell: pwsh
        run: ./atlas/scripts/build-windows.ps1 -Stage Build
      - name: Run upstream automated tests
        shell: pwsh
        run: ./atlas/scripts/build-windows.ps1 -Stage Test
      - name: Package portable application and source
        id: package
        if: always() && steps.compile.outcome == 'success'
        shell: pwsh
        run: ./atlas/scripts/build-windows.ps1 -Stage Package
      - name: Upload development candidate and source
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-development-candidate-${{ github.sha }}
          path: atlas-dist/*
          if-no-files-found: error
      - name: Upload diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-windows-diagnostics-${{ github.run_id }}
          path: |
            atlas-logs/
            build/Testing/Temporary/
            build/CMakeFiles/CMakeConfigureLog.yaml
            deps/build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
